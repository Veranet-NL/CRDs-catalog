# Inspired by https://github.com/orgs/community/discussions/153608
#
# Authentication uses a GitHub App installation token rather than a PAT: the
# Veranet enterprise rejects fine-grained PATs with a lifetime over 90 days,
# and App tokens are short-lived (1 hour) so they are not subject to that rule.
#
# Requires:
#   - vars.APP_CLIENT_ID     Client ID of the GitHub App
#   - secrets.APP_PRIVATE_KEY  Private key (PEM) of that App
# The App must be installed on this repository with at least
# "Contents: Read and write" (needed to push the merge). Grant
# "Workflows: Read and write" as well, otherwise the push is rejected whenever
# upstream changes a file under .github/workflows/.
#
# Why not `gh repo sync`: index.yaml is generated independently in this fork
# and upstream (see update-index.yaml). The generator orders new entries by
# os.listdir(), so both copies drift apart and the merge-upstream API refuses
# to sync ("diverging changes") as soon as they conflict. Instead we merge in a
# work tree and, if index.yaml is the only conflict, take upstream's version
# and regenerate it so the fork-only entries are added back.

name: Sync Fork with Upstream
on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 07:00
  workflow_dispatch:  # Allows manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions: {}  # the default GITHUB_TOKEN is not used
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0  # the merge needs the full history
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Merge upstream
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: |
          upstream=$(gh api "repos/${{ github.repository }}" --jq .parent.full_name)
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          git fetch "https://github.com/${upstream}.git" main
          message="Merge branch '${upstream%%/*}:main' into main"
          if ! git merge --no-edit -m "$message" FETCH_HEAD; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ "$conflicts" != "index.yaml" ]; then
              echo "::error::Merge conflicts that cannot be resolved automatically:"
              echo "$conflicts"
              exit 1
            fi
            echo "Resolving index.yaml conflict by regenerating it from upstream's version"
            git checkout --theirs index.yaml
            python Utilities/auto-update-index.py . index.yaml
            git add index.yaml
            git commit --no-edit
          fi

      - name: Push
        run: git push origin HEAD:main
